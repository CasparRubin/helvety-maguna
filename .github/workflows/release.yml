# Build signed/unsigned Tauri bundles and attach them to a GitHub Release.
# Trigger: push an annotated or lightweight tag matching v*.*.* (must match version in src-tauri/tauri.conf.json),
# or run the workflow manually from the Actions tab (creates/updates a draft release from tauri.conf version).
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (Windows, for llama-cpp-4 bindgen)
        if: matrix.platform == 'windows-latest'
        run: winget install LLVM.LLVM --accept-package-agreements --accept-source-agreements

      - name: Configure LLVM for bindgen (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bin = "${env:ProgramFiles}\LLVM\bin"
          if (-not (Test-Path (Join-Path $bin "libclang.dll"))) {
            throw "libclang.dll not found under $bin"
          }
          echo "LIBCLANG_PATH=$bin" >> $env:GITHUB_ENV
          echo "NM_PATH=$bin\llvm-nm.exe" >> $env:GITHUB_ENV
          echo "$bin" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Purge stale llama-cpp cmake cache (macOS)
        if: matrix.platform == 'macos-latest'
        run: node scripts/ensure-llama-cmake-cache.mjs

      - name: Install macOS build deps (llama-cpp-4)
        if: matrix.platform == 'macos-latest'
        run: brew install cmake

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: "Helvety Maguna v__VERSION__"
          releaseBody: "Download the bundle for your platform from the assets below. On macOS, if Gatekeeper blocks the app, use **Open** from the context menu once, or allow it in **Privacy & Security**."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify macOS bundle has no unpackaged dylibs
        if: matrix.platform == 'macos-latest'
        run: node scripts/verify-macos-bundle.mjs
