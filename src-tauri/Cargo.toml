[package]
name = "maguna"
version = "0.1.0"
description = "Maguna (Helvety) — GGUF catalog, installs, on-device llama-cpp-4 inference, multi-turn Chat plus modes with per-mode prompts, persisted settings incl. always-on guardrails"
authors = ["Helvety"]
edition = "2021"

[features]
# Default includes the GGUF engine. `--no-default-features` builds a lighter binary: catalog,
# download, and import still run; inference (`run_mode` / `run_mode_chat`) is unavailable.
default = ["llama"]
llama = ["dep:llama-cpp-4"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `metal`: on macOS ggml links Apple Metal GPU acceleration (much faster prompt + decode than CPU-only).
# On other targets the `metal` feature is ignored at build time; weights still run CPU-only until you use
# Vulkan/CUDA-capable backends via `llama-cpp-4` feature flags.
llama-cpp-4 = { version = "0.3", default-features = true, features = ["metal"], optional = true }
parking_lot = "0.12"

[[example]]
name = "spike_load"
path = "examples/spike_load.rs"
required-features = ["llama"]
